# Used by the anonymizer to generate FICTIONAL replacement values for detected
# project names. Two generation modes:
#   1. pick a ready-made entry from `names`, or
#   2. combine [prefix] + core [+ suffix], e.g. "Silber" + "falke" -> "Silberfalke",
#      "Blue" + "Harbor" -> "Blue Harbor", "Nordlicht" + "2.0" -> "Nordlicht 2.0".
