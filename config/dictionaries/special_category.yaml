# Keyword dictionaries for GDPR Art. 9 special-category data (German + English).
#
# Term syntax:
#   - Matched case-insensitively at word boundaries.
#   - A trailing "*" means prefix match of a word (e.g. "Depressi*" matches
#     "Depression", "Depressionen", "depressiv"). Only a trailing "*" is supported.
#   - Multi-word terms are allowed ("Grad der Behinderung", "sick leave").
#   - Umlauts are written as real umlauts (ä, ö, ü, ß).
#
# Per category:
#   score       base score for a hit on an unambiguous entry in `terms`
#   terms       unambiguous terms (count on their own)
#   weak_terms  ambiguous terms (party names, nationality adjectives, "Kirche", ...);
#               base score 0.3, should only be reported when a `context` word is nearby
#   context     words that, when found near a term, raise confidence
#
# Prefix entries were chosen so they do not swallow common non-sensitive words
# (e.g. no "Krank*" -> "Krankenkasse", no "Trans*" -> "Transport", no "Gen*" -> "Genehmigung").

