[project]
name = "pii-service"
version = "0.1.0"
description = "Local, Docker-based PII detection, redaction and pseudonymization service (DE/EN)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "presidio-analyzer>=2.2.360",
    "spacy>=3.8,<3.9",
    "faker>=30",
    "arq>=0.26",
    "redis>=5",
    "cryptography>=43",
    "lingua-language-detector>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "transformers>=4.44",
    "gliner>=0.2.20",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ml: tests that need the transformer/GLiNER models (slow, large downloads)",
    "llm: tests that need a running llama.cpp server",
]
